# 官方整合包；Release 上传副本时固定为该 Release 对应的镜像版本。
services:
  alonabot:
    image: ghcr.io/alonabot/alonabot:0.1.0
    init: true
    volumes:
      - alonabot-data:/data
    ports:
      - "127.0.0.1:7650:7650"

volumes:
  alonabot-data:

# 首次启动：docker compose -f deploy/compose.yaml up -d
# 读取一次性 token：docker compose -f deploy/compose.yaml exec alonabot alonabot admin-token show --data-dir /data
# 打开 http://127.0.0.1:7650 登录；首次登录成功后 /data/admin_token 被删除。
