// Adapter 描述、实例启停、发送、平台动作、事件交付、游标与故障载荷（WIRE §3.4、CONTRACTS §8）。
syntax = "proto3";

package alonabot.v1;

import "alonabot/v1/identity.proto";
import "alonabot/v1/message.proto";
import "alonabot/v1/errors.proto";

option go_package = "github.com/AlonaBot/AlonaBot/contracts/pb/alonabotv1";

// AdapterInstanceState 列出实例可上报的终止状态。
enum AdapterInstanceState {
  ADAPTER_INSTANCE_STATE_UNSPECIFIED = 0;
  ADAPTER_INSTANCE_STATE_FAILED = 1;
}

// AdapterDescriptor 声明安装包提供的平台能力、片段、权限、扩展事件与动作。
message AdapterDescriptor {
  string adapter_id = 1;
  repeated Capability capabilities = 2;
  repeated ExtensionDeclaration extensions = 3;
  repeated PermissionDeclaration permissions = 4;
  repeated EventDeclaration events = 5;
  repeated ActionDeclaration actions = 6;
}

// ExtensionDeclaration 声明平台专有片段的名称、版本与 JSON Schema。
message ExtensionDeclaration {
  string name = 1;
  uint32 version = 2;
  string schema_json = 3;
}

// PermissionDeclaration 声明平台权限及其隐含关系。
message PermissionDeclaration {
  // 完整权限名，带本 Adapter 的 ID 前缀。
  string name = 1;
  // 本 Adapter 已声明的完整权限名或 chat_admin。
  repeated string implies = 2;
  // Adapter 包 i18/ 中 messages 的文案键。
  string label_key = 3;
}

// EventDeclaration 声明平台扩展事件及其载荷 Schema。
message EventDeclaration {
  // 完整事件名，带本 Adapter 的 ID 前缀。
  string name = 1;
  uint32 version = 2;
  string schema_json = 3;
}

// AdapterInstanceStartRequest 下发实例配置与已持久化游标。
message AdapterInstanceStartRequest {
  string instance_id = 1;
  string config_json = 2;
  bytes cursor = 3;
}

// AdapterInstanceStartResponse 返回已验证账号与实例能力。
message AdapterInstanceStartResponse {
  string account_id = 1;
  optional string account_display_name = 2;
  repeated Capability capabilities = 3;
  optional string account_username = 4; // 平台上可寻址的账号标识；平台没有时 absent。
}

// AdapterInstanceStopRequest 指定要停止接收的实例。
message AdapterInstanceStopRequest {
  string instance_id = 1;
}

// AdapterInstanceStopResponse 确认实例已经停止。
message AdapterInstanceStopResponse {
}

// AdapterSendRequest 向指定实例发送消息链；响应为 SendResult。
message AdapterSendRequest {
  string instance_id = 1;
  Target target = 2;
  MessageChain chain = 3;
}

// AdapterDeliverRequest 交付实例事件及交付后的游标。
message AdapterDeliverRequest {
  string instance_id = 1;
  Event event = 2;
  bytes cursor = 3;
}

// AdapterDeliverResponse 报告 Core 是否接纳事件。
message AdapterDeliverResponse {
  bool accepted = 1;
}

// AdapterCursorRequest 保存没有事件时推进的游标。
message AdapterCursorRequest {
  string instance_id = 1;
  bytes cursor = 2;
}

// AdapterCursorResponse 确认游标已持久化。
message AdapterCursorResponse {
}

// AdapterStatusRequest 报告实例致命错误。
message AdapterStatusRequest {
  string instance_id = 1;
  AdapterInstanceState state = 2;
  ErrorInfo safe_error = 3;
}

// AdapterStatusResponse 确认实例故障已处理。
message AdapterStatusResponse {
}

// AdapterMediaReadRequest 从指定实例读取平台文件，length 为 1～1 MiB。
message AdapterMediaReadRequest {
  string instance_id = 1;
  string file_id = 2;
  uint64 offset = 3;
  uint32 length = 4;
}

// AdapterMediaReadResponse 返回文件分块及下一次读取位置。
message AdapterMediaReadResponse {
  bytes data = 1;
  uint64 next_offset = 2;
  bool eof = 3;
}

// AdapterEditRequest 向指定实例提交消息编辑；响应为 SendResult。
message AdapterEditRequest {
  string instance_id = 1;
  Target target = 2;
  string platform_message_id = 3;
  // 恰好一个 text 片段和至多一个 buttons 片段。
  MessageChain chain = 4;
}

// ActionScope 指定动作需要会话还是只需要账号实例。
enum ActionScope {
  ACTION_SCOPE_UNSPECIFIED = 0;
  ACTION_SCOPE_CHAT = 1;
  ACTION_SCOPE_ACCOUNT = 2;
}

// ActionDeclaration 声明平台动作的版本、作用范围与参数和结果 Schema。
message ActionDeclaration {
  string name = 1;
  uint32 version = 2;
  ActionScope scope = 3;
  string params_schema_json = 4;
  string result_schema_json = 5;
}

// ActionRequest 向 Core 提交动作；to 与 adapter_instance_id 互斥。
message ActionRequest {
  Target to = 1;
  string adapter_instance_id = 2;
  string name = 3;
  uint32 version = 4;
  string params_json = 5;
}

// ActionResponse 保留平台返回的 JSON 原文，可以与安全错误同时返回。
message ActionResponse {
  string result_json = 1;
}

// AdapterActionRequest 向指定实例提交动作；账号动作省略 target。
message AdapterActionRequest {
  string instance_id = 1;
  Target target = 2;
  string name = 3;
  uint32 version = 4;
  string params_json = 5;
}
