// 包管理固定服务的请求与响应，身份取自 Core 保存的父调用。
syntax = "proto3";

package alonabot.v1;

option go_package = "github.com/AlonaBot/AlonaBot/contracts/pb/alonabotv1";

// PackageListRequest 查询已安装包。
message PackageListRequest {}

// PackageInfo 保存安装记录与 manifest 的公开信息。
message PackageInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string role = 4;
  bool enabled = 5;
  string source = 6;
}

// PackageListResponse 按 id 字典序返回已安装包。
message PackageListResponse {
  repeated PackageInfo packages = 1;
}

// PackageInstallRequest 从 owner/repo 安装包；管理员同意来源信任与同类替换。
message PackageInstallRequest {
  string source = 1;
}

// PackageInstallResponse 保留安装结果与受影响对象，可随错误一同返回。
message PackageInstallResponse {
  PackageInfo package = 1;
  repeated string affected = 2;
}
