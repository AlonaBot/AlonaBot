// Target、Actor 与平台能力（MESSAGE-MODEL §1）。单独成文件，避免 message 与 media 互相 import。公共标识符一律用字符串，缺省表示不存在，不用空串或零 ID 填补。
syntax = "proto3";

package alonabot.v1;

option go_package = "github.com/AlonaBot/AlonaBot/contracts/pb/alonabotv1";

// Target 描述一次发送的平台目标，唯一定位到某个 Adapter 实例下的会话或话题。
message Target {
  // Adapter 类型，例如 telegram。
  string adapter_id = 1;
  // 该 Adapter 的已配置实例；插件发出时可以为空，由 Core 补齐。
  string adapter_instance_id = 2;
  // 实例下用于发送的平台账号；插件发出时可以为空，由 Core 补齐。
  string account_id = 3;
  // 平台会话 ID。
  string chat_id = 4;
  // 话题 ID；缺省表示会话本身，不用空串代替。
  optional string thread_id = 5;
}

// Actor 描述事件的触发者，只由可信 Adapter 元数据与 Core policy 生成；插件自报的身份不是依据。
message Actor {
  reserved 4;
  reserved "trusted_roles";
  // 平台上的用户 ID。
  string external_user_id = 1;
  // 用户 ID 所属的 Adapter 实例。
  string adapter_instance_id = 2;
  // 展示名；平台没有提供时缺省。
  optional string display_name = 3;
  // 平台提供的语言，按 BCP 47 规范化；未提供时缺省。
  optional string locale = 5;
  // Core 计算的权限名集合；Adapter 只提供已声明的平台权限。
  repeated string permissions = 6;
}

// Capability 描述 Adapter 公布的一项平台能力；未知能力不推定支持。
message Capability {
  // 能力名。
  string name = 1;
  // 能力版本。
  uint32 version = 2;
  // 该实例当前是否支持。
  bool supported = 3;
  // 单条文本限额；未声明时缺省，仅 supported=true 的 message.send 可携带。
  TextLimit text_limit = 4;
}

// TextLimit 声明单条文本的正整数上限与计量单位。
message TextLimit {
  uint64 max = 1;
  TextUnit unit = 2;
}

// TextUnit 指定文本限额的计量单位，bytes 按 UTF-8 编码计数。
enum TextUnit {
  TEXT_UNIT_UNSPECIFIED = 0;
  TEXT_UNIT_UTF16_CODE_UNITS = 1;
  TEXT_UNIT_UNICODE_CODE_POINTS = 2;
  TEXT_UNIT_BYTES = 3;
}
