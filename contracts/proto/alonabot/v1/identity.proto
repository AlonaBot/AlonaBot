// Target、Actor 与平台能力，见 MESSAGE-MODEL §1。单独成文件以避免 message/media 互相 import。
// 公共标识符一律用字符串；absent 表示不存在，不用空串或零 ID 填补。
syntax = "proto3";

package alonabot.v1;

option go_package = "github.com/AlonaBot/alonabot/contracts/pb/alonabotv1";

message Target {
  string adapter_id = 1;
  string adapter_instance_id = 2;
  string account_id = 3;
  string chat_id = 4;
  optional string thread_id = 5;
}

enum TrustedRole {
  TRUSTED_ROLE_UNSPECIFIED = 0;
  // 具有可信个人身份的普通用户。
  TRUSTED_ROLE_USER = 1;
  // Core 按 adapter_instance_id/external_user_id 配置的机器人管理员。
  TRUSTED_ROLE_ADMIN = 2;
  // 平台群管理员，只用于 chat_admin Rule，不赋予 Core 管理权。
  TRUSTED_ROLE_CHAT_ADMIN = 3;
}

// 只由可信 Adapter 元数据与 Core policy 生成；插件自报的身份不是依据。
message Actor {
  string external_user_id = 1;
  string adapter_instance_id = 2;
  optional string display_name = 3;
  repeated TrustedRole trusted_roles = 4;
}

// Adapter 公布的平台能力；未知能力不推定支持。
message Capability {
  string name = 1;
  uint32 version = 2;
  bool supported = 3;
}
