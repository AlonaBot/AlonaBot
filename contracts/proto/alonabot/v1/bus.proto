// Event Bus 载荷，见 CONTRACTS §3、WIRE §5。发布只确认 Core 接纳，不确认订阅者处理。
syntax = "proto3";

package alonabot.v1;

import "alonabot/v1/envelope.proto";

option go_package = "github.com/AlonaBot/AlonaBot/contracts/pb/alonabotv1";

// 发布者只能使用自己的 plugin_id/event_name 命名空间。
message PublishRequest {
  // 本插件命名空间内的 event_name（不含 plugin_id 前缀）。
  string event_name = 1;
  string schema_id = 2;
  uint32 schema_version = 3;
  PayloadEncoding encoding = 4;
  bytes payload = 5;
}

message PublishResponse {
  string event_id = 1;
}

// EVENT 帧（Core→订阅者，call_id=0）的载荷；无业务 ACK、重放或补发。
message BusEvent {
  // plugin_id/event_name。
  string event_name = 1;
  string event_id = 2;
  string source_plugin_id = 3;
  int64 occurred_at_unix_ms = 4;
  string schema_id = 5;
  uint32 schema_version = 6;
  PayloadEncoding encoding = 7;
  bytes payload = 8;
}
