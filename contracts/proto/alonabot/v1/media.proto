// Core 媒体服务 BeginUpload/WriteChunk/CommitUpload/Read/Grant，见 CONTRACTS §1.3/§1.4、WIRE §5。
syntax = "proto3";

package alonabot.v1;

import "alonabot/v1/identity.proto";

option go_package = "github.com/AlonaBot/alonabot/contracts/pb/alonabotv1";

// 已提交上传对象的能力引用；绑定 owner Session 与消费范围。
message MediaRef {
  string token = 1;
  uint64 size = 2;
  string mime = 3;
  bytes sha256 = 4;
  int64 expires_at_unix_ms = 5;
  MediaScope scope = 6;
}

// 允许的消费方/目标范围；空列表表示仅 owner 自身。
message MediaScope {
  repeated string consumer_plugin_ids = 1;
  repeated Target targets = 2;
}

enum MediaReadability {
  MEDIA_READABILITY_UNSPECIFIED = 0;
  MEDIA_READABILITY_READABLE = 1;
  // 超出平台下载能力（读取返回 UNSUPPORTED）。
  MEDIA_READABILITY_UNSUPPORTED = 2;
}

// 入站媒体描述符：尚未取件，不等于已校验 MediaRef；未知 size/MIME 保持 absent。
message IncomingMedia {
  string token = 1;
  optional uint64 size = 2;
  optional string mime = 3;
  MediaReadability readability = 4;
  int64 expires_at_unix_ms = 5;
}

message BeginUploadRequest {
  uint64 size = 1;
  string mime = 2;
  bytes sha256 = 3;
}

message BeginUploadResponse {
  string upload_id = 1;
  int64 expires_at_unix_ms = 2;
}

// 顺序分块：offset 必须等于当前已确认长度，每块最多 1 MiB。
message WriteChunkRequest {
  string upload_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message WriteChunkResponse {
  uint64 next_offset = 1;
}

message CommitUploadRequest {
  string upload_id = 1;
}

message CommitUploadResponse {
  MediaRef ref = 1;
}

// token 可以是 MediaRef 或 IncomingMedia 的 token；length 为 1～1 MiB。
message ReadRequest {
  string token = 1;
  uint64 offset = 2;
  uint32 length = 3;
}

message ReadResponse {
  bytes data = 1;
  uint64 next_offset = 2;
  bool eof = 3;
}

// 只签发等同或更窄范围的新 token，不能扩大对象、Target 或有效期。
message GrantRequest {
  string token = 1;
  string grantee_plugin_id = 2;
  repeated Target targets = 3;
}

message GrantResponse {
  string token = 1;
  int64 expires_at_unix_ms = 2;
}
