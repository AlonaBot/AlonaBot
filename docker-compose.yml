# 官方整合包；从对应发行 tag 下载此文件，镜像版本与该 tag 一致。
services:
  alonabot:
    image: ghcr.io/alonabot/alonabot:0.2.0
    init: true
    volumes:
      - alonabot-data:/data
    ports:
      - "127.0.0.1:7650:7650"

volumes:
  alonabot-data:

# 首次启动：docker compose up -d
# 读取管理 token：docker compose exec alonabot alonabot admin-token show --data-dir /data
# 打开 http://127.0.0.1:7650 登录；凭据保存在 /data/admin_token。
