# 只写 GitHub 标签和 assignee，不 checkout、不运行 PR 提交的代码。
name: PR triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Create path labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 标签名称与 labeler.yml 的区域保持一致，更新而不是重复创建。
          gh label create 'area: docs' --repo "$REPO" --color 0E8A16 --description '文档、规格和代理技能' --force
          gh label create 'area: contracts' --repo "$REPO" --color 0052CC --description '协议源、生成类型和纯校验' --force
          gh label create 'area: sdk' --repo "$REPO" --color 5319E7 --description '插件 SDK 和示例' --force
          gh label create 'area: core' --repo "$REPO" --color B60205 --description 'Core、IPC、进程和状态' --force
          gh label create 'area: adapters' --repo "$REPO" --color 1D76DB --description '平台 Adapter' --force
          gh label create 'area: frontend' --repo "$REPO" --color D4C5F9 --description '管理界面' --force
          gh label create 'area: tests' --repo "$REPO" --color C5DEF5 --description '测试与 fixture' --force
          gh label create 'area: github-actions' --repo "$REPO" --color FBCA04 --description '仓库自动化和检查脚本' --force
      - name: Sync path labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ github.token }}
          sync-labels: true
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee FlanChanXwO
