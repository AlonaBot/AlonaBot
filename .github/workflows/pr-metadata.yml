# 从受信 workflow 校验 PR 说明；PR 正文只作为数据读取，不 checkout 或执行 PR 代码。
name: PR metadata

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  metadata:
    name: PR description
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: 检查模板段落和确认项
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module <<'JS'
          // 本脚本校验说明结构；确认项是否真实由审阅者判断。
          import assert from 'node:assert/strict';

          // 1. 移除模板提示和代码块，避免提示文字或示例被当作实际说明。
          const body = (process.env.PR_BODY || '')
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/^(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\1\s*$/gm, '[代码块]');

          // 2. 每个约定段落都必须有实际内容。
          for (const heading of ['变更与原因 / Changes', '验证 / Verification', '兼容性与风险 / Compatibility and risks']) {
            const section = body.match(new RegExp(`^## ${heading}\\s*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, 'm'));
            assert.ok(section && section[1].trim(), `缺少实际说明：${heading}`);
          }

          // 3. 对照模板逐项确认，避免用无关勾选绕过必填清单。
          const checklist = [
            '改动在已确认范围内，不含凭据、真实用户数据或本地临时测试 / The change stays within the confirmed scope and contains no credentials, real user data, or local temporary tests',
            '没有新增依赖，或已取得维护者明确批准并说明用途 / No new dependencies, or a maintainer approved them and their purpose is stated',
            '已按编码规范检查包文档、命名、注释与测试提交范围，或本次不涉及代码 / Package docs, naming, comments, and test scope follow the coding standards, or this change has no code',
            '相关契约、文档和生成源已同步，或本次不需要同步 / Related contracts, docs, and generated sources are in sync, or no sync was needed',
          ];
          for (const item of checklist) {
            assert.ok(body.split('\n').some(line => line.trim() === `- [x] ${item}` || line.trim() === `- [X] ${item}`), `尚未确认：${item}`);
          }
          JS
