# 按实际模块路径同步 PR 的 area 标签；一个 PR 可以涉及多个区域。
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**", "changelog/**"]
"area: contracts":
  - changed-files:
      - any-glob-to-any-file: ["contracts/**"]
"area: sdk":
  - changed-files:
      - any-glob-to-any-file: ["sdk/**", "examples/**"]
"area: core":
  - changed-files:
      - any-glob-to-any-file: ["internal/core/**", "internal/app/**", "internal/wire/**", "internal/oslock/**", "cmd/**", "go.mod", "go.sum"]
"area: adapters":
  - changed-files:
      - any-glob-to-any-file: ["internal/core/adapter/**"]
"area: tests":
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "**/*_test.go", "**/testdata/**"]
"area: github-actions":
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
