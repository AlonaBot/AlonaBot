# 收集需求的使用目的、期望行为和兼容性约束，并指派维护者评估。
name: 功能请求
description: 提出有明确使用场景的改进。
title: "[Feature] "
labels: [enhancement]
assignees: [FlanChanXwO]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明谁在什么场景下遇到困难，不只列实现方案。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为与完成条件
      description: 提供使用示例；与现行规格冲突时指出章节。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 替代方案与兼容性
      description: 可选。说明已尝试的办法，以及协议、插件、配置或数据迁移影响。
